name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned dependencies and unified app
        shell: powershell
        run: .\build.ps1
      - name: Publish preview build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PyroScreen-preview
          path: dist/*-preview.zip
